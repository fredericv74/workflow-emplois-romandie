[project]
name = "emplois-romandie-worker"
version = "0.1.0"
description = "Rapport quotidien des offres dessinateur projeteur / projeteur en Suisse romande (GE, VD, VS)"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows[mistralai]>=3.18.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/worker/src/worker"]
